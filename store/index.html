<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>79云门店端交互原型</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e9ed;font-family:-apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}#phone{width:min(100%,430px);height:100dvh;overflow-y:auto;overscroll-behavior:contain;margin:auto;background:#fff;box-shadow:0 0 35px #0002;scrollbar-width:none}#phone::-webkit-scrollbar{display:none}#scene{position:relative;width:100%;line-height:0}#scene img{display:block;width:100%;height:auto}.hot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;touch-action:manipulation}.hot:focus-visible{outline:2px solid #7040fb;outline-offset:-2px}.entry{position:absolute;border:0;background:#f8f8f8;color:#333;font:14px sans-serif;outline:none;padding:2px 6px;line-height:normal}.toast{position:fixed;bottom:10%;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:8px;background:#222e;color:#fff;font-size:14px;z-index:5;white-space:nowrap;line-height:1.4}.overlay{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:4}.dialog{width:min(86%,340px);background:white;border-radius:16px;padding:22px;color:#222;line-height:1.5}.dialog h3{margin:0 0 10px;font-size:17px}.dialog p{font-size:14px;color:#666}.dialog button{border:0;background:#7654ff;color:white;border-radius:8px;padding:10px 18px;cursor:pointer}.dialog .actions{display:flex;gap:8px;justify-content:flex-end}.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menu button{padding:14px 8px}.menu .close{grid-column:span 2;background:#eee;color:#333}</style></head><body><main id="phone"><div id="scene"></div></main><script src="manifest.js"></script><script src="app.js"></script></body></html>
